spring.application.name=ocp-pdr-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

ai.service.url=http://localhost:8000
pdr.app.jwtSecret=ocp_pdr_secret_key_which_must_be_at_least_256_bits_long_for_hmac_sha256
pdr.app.jwtExpirationMs=86400000
pdr.app.jwtRefreshExpirationMs=604800000
