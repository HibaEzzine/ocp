spring.application.name=ocp-pdr-backend

# Configuration Base de données MySQL Unifiée (pdr_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/pdr_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Support pour les imports de fichiers Excel volumineux
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=600MB
spring.servlet.multipart.file-size-threshold=1MB

# Configuration Serveur Tomcat
server.port=8080
server.tomcat.connection-timeout=60000
server.tomcat.max-swallow-size=600MB

# URL du Microservice Python IA (FastAPI)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Swagger UI & OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
